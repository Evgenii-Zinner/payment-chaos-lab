services:
  db:
    image: mariadb:11
    container_name: lab_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: payments_lab
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lab_redis

  telco:
    build:
      context: ./services
      args:
        SERVICE_DIR: telco
    container_name: lab_telco
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      DB_HOST: db
      DB_PASS: rootpass
      DB_NAME: payments_lab
      REDIS_HOST: redis
      LOG_FILE: /logs/telco.log
    volumes:
      - ./logs/telco:/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  aggregator:
    build:
      context: ./services
      args:
        SERVICE_DIR: aggregator
    container_name: lab_aggregator
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PASS: rootpass
      DB_NAME: payments_lab
      REDIS_HOST: redis
      TELCO_URL: http://telco:8003
      LOG_FILE: /logs/app.log
    volumes:
      - ./logs/aggregator:/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: lab_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - aggregator

  merchant:
    build:
      context: ./services
      args:
        SERVICE_DIR: merchant
    container_name: lab_merchant
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      AGGREGATOR_URL: http://nginx:80
      REDIS_HOST: redis
      LOG_FILE: /logs/merchant.log
    volumes:
      - ./logs/merchant:/logs
    depends_on:
      - nginx

  adminer:
    image: adminer:4
    container_name: lab_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.8
    container_name: lab_loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    container_name: lab_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/lab:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lab_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - db

volumes:
  db_data:
  grafana_data:
